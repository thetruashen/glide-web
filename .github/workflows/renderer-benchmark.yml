name: Renderer CPU benchmark
on:
  workflow_dispatch:
    inputs:
      loader:
        type: choice
        options: [vanilla, neoforge]
        default: vanilla
      suite:
        type: choice
        options: [full, confirm]
        default: full
      candidate:
        type: choice
        options: [threads-2, threads-3, threads-4-vector128, threads-3-vector128]
        default: threads-3
permissions:
  contents: read
concurrency:
  group: renderer-benchmark-${{ inputs.loader }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DISPLAY: ':99'
      GLIDE_MINECRAFT_DIR: /home/runner/glide-minecraft
      GLIDE_MINECRAFT_VERSION: '1.21.1'
      GLIDE_MINECRAFT_LOADER: ${{ inputs.loader }}
      GLIDE_MINECRAFT_XMX: 4G
      GLIDE_JAVA_MAJOR: '21'
      GLIDE_AUTH_MODE: offline
      GLIDE_OFFLINE_USERNAME: BenchPlayer
      GLIDE_RESOLUTION_PRESET: custom
      GLIDE_RENDER_WIDTH: '960'
      GLIDE_RENDER_HEIGHT: '540'
      GLIDE_MAX_RESTARTS: '0'
      GLIDE_GAMEPLAY_PERFORMANCE: '1'
      BENCH_SUITE: ${{ inputs.suite }}
      BENCH_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r Client/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/glide-minecraft/assets
            /home/runner/glide-minecraft/libraries
            /home/runner/glide-minecraft/versions
            /home/runner/glide-minecraft/.glide-install
          key: benchmark-v1-${{ inputs.loader }}
          restore-keys: game-v3-Linux-X64-21-1.21.1-${{ inputs.loader }}-
      - name: Prepare game and measurement tools
        run: |
          GLIDE_INSTALL_ONLY=1 python Client/scripts/glide_launch.py &
          GAME_PREP=$!
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb x11-utils ffmpeg libgl1-mesa-dri libglx-mesa0 libgl1 mesa-utils mangohud libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libasound2t64
          wait "$GAME_PREP"
      - name: Start measured desktop
        run: |
          Xvfb :99 -screen 0 960x540x24 -ac +extension GLX >/tmp/benchmark-xorg.log 2>&1 &
          for i in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          mkdir -p benchmark-results
          glxinfo -B >benchmark-results/renderer.txt
          lscpu >benchmark-results/cpu.txt
      - name: Measure repeatable in-game camera movement without mods
        run: python Client/benchmarks/renderer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-${{ inputs.loader }}
          path: benchmark-results
          retention-days: 7
