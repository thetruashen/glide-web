name: Prewarm Glide caches
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated versions, or all for a bounded catalog batch
        type: string
        default: '1.21.1,1.20.1,1.21.4'
      offset:
        description: Catalog offset when versions=all (20 versions per batch)
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: prewarm
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r Client/requirements.txt
      - id: plan
        env:
          WARM_VERSIONS: ${{ inputs.versions }}
          WARM_OFFSET: ${{ inputs.offset }}
        run: python Client/scripts/warm_plan.py
  game:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Client/requirements.txt
      - run: pip install -r Client/requirements.txt
      - name: Select Java and game inputs
        id: request
        env:
          VERSION: ${{ matrix.version }}
          LOADER: ${{ matrix.loader }}
        run: |
          python - <<'PY'
          import base64, json, os
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          os.environ['GLIDE_REQUEST'] = json.dumps({'version': os.environ['VERSION'], 'loader': os.environ['LOADER'], 'origin': 'https://example.invalid', 'publicKey': base64.b64encode(key.public_key().public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)).decode()})
          exec(compile(open('Client/scripts/prepare_request.py').read(), 'prepare_request.py', 'exec'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.request.outputs.java }}
      - uses: actions/cache/restore@v4
        id: game
        with:
          path: |
            /home/runner/glide-minecraft/assets
            /home/runner/glide-minecraft/libraries
            /home/runner/glide-minecraft/versions
            /home/runner/glide-minecraft/.glide-install
          key: game-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.request.outputs.java }}-${{ matrix.version }}-${{ matrix.loader }}-${{ hashFiles('Client/scripts/glide_launch.py', 'Client/requirements.txt') }}
      - name: Preinstall game and loader, including NeoForge processors
        if: steps.game.outputs.cache-hit != 'true'
        run: GLIDE_INSTALL_ONLY=1 python Client/scripts/glide_launch.py
      - uses: actions/cache/save@v4
        if: steps.game.outputs.cache-hit != 'true'
        with:
          path: |
            /home/runner/glide-minecraft/assets
            /home/runner/glide-minecraft/libraries
            /home/runner/glide-minecraft/versions
            /home/runner/glide-minecraft/.glide-install
          key: ${{ steps.game.outputs.cache-primary-key }}
  streaming:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        with:
          path: /home/runner/glide-tools
          key: streaming-ubuntu24-amd64-selkies2.0.0-v1
      - run: |
          mkdir -p /home/runner/glide-tools
          cd /home/runner/glide-tools
          PKG=selkies-2.0.0-ubuntu24.04-amd64.deb
          test -s "$PKG" || curl -fL --retry 3 "https://github.com/selkies-project/selkies/releases/download/2.0.0/$PKG" -o "$PKG"
          test -s cloudflared || curl -fL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
